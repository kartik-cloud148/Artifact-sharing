name: Docker Artifact Sharing

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
        environment:
            description: "Select Environment"
            required: true
            type: choice
            options:
                - dev
                - qa 
                - prod
                - staging
                

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/artifact-sharing:latest .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/artifact-sharing:latest

  test:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      packages: read

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/artifact-sharing:latest

      - name: Test Docker image
        run: |
          docker run --rm ghcr.io/${{ github.repository_owner }}/artifact-sharing:latest
  deploy:
    needs: test
    runs-on: ubuntu-latest

    permissions:
        packages: read

    env:
       DEPLOY_ENV: ${{ inputs.environment }}
    
    steps:
        - name: Show Selected Environment
          run: |
            echo "Selected Environment: ${{ env.DEPLOY_ENV }}"
        
        - name: Login to GHCR
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
                

        - name: Pull Docker Image
          run: |
            docker pull ghcr.io/${{ github.repository_owner }}/artifact-sharing:latest

        - name: deploy Docker Image
          run: |
            docker run -d --name my-app ghcr.io/${{ github.repository_owner }}/artifact-sharing:latest
        - name: Check application
          run: |
            docker ps -a
